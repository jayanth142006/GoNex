<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="GoNex — the CryptoNet help assistant" />
    <title>GoNex · CryptoNet Assistant</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%230d9488'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">G</div>
          <div class="brand-text">
            <h1>GoNex</h1>
            <p class="subtitle">
              <span class="status-dot" id="statusDot" aria-hidden="true"></span>
              <span id="statusText">CryptoNet help assistant</span>
            </p>
          </div>
        </div>
        <button type="button" class="ghost-btn" id="newChatBtn" title="Start a new conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/></svg>
          <span>New chat</span>
        </button>
      </header>

      <main class="chat" id="chat" aria-live="polite" aria-label="Conversation with GoNex">
        <section class="welcome" id="welcome">
          <div class="welcome-logo" aria-hidden="true">G</div>
          <h2>Hi, I'm GoNex 👋</h2>
          <p>
            I can explain how CryptoNet works: payment requests, the UPI and crypto flow, request states,
            fees, wallets and common issues. What would you like to know?
          </p>
          <div class="suggestions" id="suggestions">
            <button type="button" class="chip">How does CryptoNet work?</button>
            <button type="button" class="chip">What does COMMITTED mean?</button>
            <button type="button" class="chip">How do I become a resolver?</button>
            <button type="button" class="chip">What fees do I pay?</button>
            <button type="button" class="chip">Is my UPI payment verified?</button>
            <button type="button" class="chip">MetaMask rejected my transaction</button>
          </div>
        </section>
        <div class="messages" id="messages"></div>
      </main>

      <footer class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <label for="input" class="sr-only">Message GoNex</label>
          <textarea id="input" rows="1" maxlength="2000" placeholder="Ask about CryptoNet…" enterkeyhint="send"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
          </button>
        </form>
        <div class="composer-meta">
          <span>GoNex is informational only. Never share your seed phrase or private keys.</span>
          <span class="counter" id="counter" hidden></span>
        </div>
      </footer>
    </div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
